function animatePart(id,removing){
 const part=parts[id],g=part.group;
 if(busy)return;
 busy=true;
 if(selectionHelper){scene.remove(selectionHelper);selectionHelper.geometry.dispose();selectionHelper.material.dispose();selectionHelper=null}
 if(!removing){g.visible=true;g.position.y-=.75}
 const start=g.position.y,target=start+(removing?.75:-.75),t0=performance.now(),duration=420;
 document.querySelector('#remove').disabled=true;document.querySelector('#install').disabled=true;
 function frame(now){
  const t=Math.min(1,(now-t0)/duration),ease=1-Math.pow(1-t,3);
  g.position.y=start+(target-start)*ease;
  if(t<1){requestAnimationFrame(frame);return}
  if(removing){g.visible=false;part.removed=true}else{g.position.y=0;part.removed=false}
  busy=false;choose(id);refresh();toast(part.name+(removing?' démonté(e)':' remonté(e)'));
 }
 requestAnimationFrame(frame);
}

 document.querySelector('#install').disabled=!part.removed;
 if(selectionHelper){scene.remove(selectionHelper);selectionHelper.geometry.dispose();selectionHelper.material.dispose();selectionHelper=null}
 if(!part.removed){selectionHelper=new THREE.BoxHelper(part.group,0x65f0ad);selectionHelper.material.depthTest=false;selectionHelper.material.transparent=true;selectionHelper.material.opacity=.95;scene.add(selectionHelper)}
}

document.querySelector('#remove').addEventListener('click',()=>{if(!selected||busy)return;const part=parts[selected];if(part.removed)return;animatePart(selected,true)});

function updateCamera(){polar=THREE.MathUtils.clamp(polar,.35,1.48);distance=THREE.MathUtils.clamp(distance,4.8,15);camera.position.set(target.x+distance*Math.sin(polar)*Math.sin(azimuth),target.y+distance*Math.cos(polar),target.z+distance*Math.sin(polar)*Math.cos(azimuth));camera.lookAt(target)}

const pointers=new Map();

const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();let downAt=null;

renderer.domElement.addEventListener('pointerup',e=>{if(busy)return;if(!downAt||downAt.id!==e.pointerId)return;const movedPx=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y);downAt=null;if(movedPx>7||pointers.size>0)return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(car,true);for(const hit of hits){let o=hit.object;while(o&&o!==car&&!o.userData.partId)o=o.parent;if(o&&o.userData.partId){choose(o.userData.partId);return}}});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
function animate(){requestAnimationFrame(animate);if(selectionHelper)selectionHelper.update();renderer.render(scene,camera)}animate();
