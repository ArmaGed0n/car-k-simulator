<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K Mécanique Simulator</title>
<style>
:root{color-scheme:dark;--green:#62dda1;--panel:#111d29;--line:#ffffff20}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101820;color:#f3f6f8;font-family:system-ui,Arial,sans-serif}canvas{display:block;touch-action:none}
#top{position:fixed;z-index:3;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.brand,.pill{background:#101923df;border:1px solid var(--line);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}.brand{font-weight:950;letter-spacing:1.5px}.brand b{color:var(--green)}.pill{font-size:12px;color:#cbd5dc}
#panel{position:fixed;z-index:4;right:14px;top:76px;width:min(300px,calc(100vw - 28px));background:#111d29ed;border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(12px);box-shadow:0 12px 36px #0005}
.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--green);font-weight:900}h1{font-size:20px;margin:5px 0 7px}p{font-size:13px;line-height:1.45;color:#b9c6cf;margin:0 0 12px}
button{border:0;border-radius:10px;padding:11px 13px;font-weight:850;cursor:pointer;background:var(--green);color:#071a12}button:disabled{opacity:.4;cursor:default}.secondary{background:#293b49;color:#e9f0f4}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;font-size:12px;min-width:88px}#view-reset{background:#344957;color:#eaf4f8}
#progress{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.progress-head{display:flex;justify-content:space-between;font-size:11px;color:#cbd5dc;margin-bottom:7px}.bar{height:7px;background:#293844;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
#hint{position:fixed;z-index:2;left:50%;bottom:15px;transform:translateX(-50%);background:#101923d9;border:1px solid var(--line);padding:9px 13px;border-radius:12px;color:#cbd5dc;font-size:11px;white-space:nowrap;pointer-events:none}
#toast{position:fixed;z-index:5;left:50%;top:76px;transform:translateX(-50%);background:#173d30;color:#dffff0;border:1px solid #62dda155;padding:10px 15px;border-radius:12px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
@media(max-width:650px){#panel{top:auto;bottom:55px;left:10px;right:10px;width:auto;padding:12px}h1{font-size:17px}p{font-size:12px;margin-bottom:8px}#progress{margin-top:9px;padding-top:8px}#hint{bottom:8px;font-size:10px}.brand{font-size:12px}.pill{font-size:10px;padding:8px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="top"><div class="brand">K <b>MÉCANIQUE</b> · SIMULATOR</div><div class="pill">ATELIER 01 · PEUGEOT 205</div></div>
<aside id="panel">
 <div class="eyebrow">POSTE DE TRAVAIL</div><h1 id="part-name">Sélectionne une pièce</h1>
 <p id="part-info">Clique sur une pièce de la voiture pour afficher sa fiche et commencer le démontage.</p>
 <div class="actions"><button id="remove" disabled>DÉMONTER</button><button id="install" class="secondary" disabled>REMETTRE</button><button id="view-reset" type="button">VUE 360°</button></div>
 <div id="progress"><div class="progress-head"><span>PIÈCES DÉMONTÉES</span><b id="count">0 / 9</b></div><div class="bar"><span id="bar"></span></div></div>
</aside>
<div id="toast"></div>
<div id="hint">FAIS GLISSER POUR TOURNER · PINCE POUR ZOOMER · CLIQUE SUR UNE PIÈCE</div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x18232d);scene.fog=new THREE.Fog(0x18232d,18,38);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100); 
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8e5ff,0x34302b,2.1));
const key=new THREE.DirectionalLight(0xffe4bd,3.1);key.position.set(-5,10,7);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const fill=new THREE.PointLight(0x73aaff,45,18);fill.position.set(5,5,-4);scene.add(fill);
const floorMat=new THREE.MeshStandardMaterial({color:0x454c50,roughness:.88});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),floorMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(40,40,0x65717a,0x59636a);grid.position.y=-.025;scene.add(grid);
const wallMat=new THREE.MeshStandardMaterial({color:0x263541,roughness:.9});
function box(parent,w,h,d,x,y,z,mat,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
box(scene,20,7,.35,0,3.45,-7.8,wallMat,false);
for(let x=-7;x<=7;x+=3.5){box(scene,.08,5,.1,x,3.1,-7.58,new THREE.MeshStandardMaterial({color:0x344754}),false)}
// Établi et rangements pour donner une identité visuelle à l'atelier.
box(scene,3.8,.18,1.1,-5,.95,-3.7,new THREE.MeshStandardMaterial({color:0x9b7652}));
for(const x of [-6.5,-3.5])box(scene,.12,.95,.12,x,.45,-3.7,new THREE.MeshStandardMaterial({color:0x202a31}));
for(let i=0;i<4;i++)box(scene,.62,.42,.45,-6.2+i*.78,1.35,-3.7,new THREE.MeshStandardMaterial({color:[0x267b69,0x42647d,0xb77b32,0x9d4141][i]}));
const liftMat=new THREE.MeshStandardMaterial({color:0xe1b83e,metalness:.25,roughness:.55});
for(const x of [-2.15,2.15]){box(scene,.18,2.6,.2,x,1.3,-.15,liftMat);box(scene,1.05,.13,.22,x,1.02,.15,liftMat)}
// Voiture orientée vers l'avant (+Z).
const car=new THREE.Group();scene.add(car);
const paint=new THREE.MeshStandardMaterial({color:0xc52c32,metalness:.24,roughness:.3});
const black=new THREE.MeshStandardMaterial({color:0x151a1e,roughness:.72});
const rubber=new THREE.MeshStandardMaterial({color:0x101214,roughness:.96});
const glass=new THREE.MeshStandardMaterial({color:0x345665,metalness:.2,roughness:.2});
const metal=new THREE.MeshStandardMaterial({color:0xaeb9bd,metalness:.82,roughness:.25});
const lightMat=new THREE.MeshStandardMaterial({color:0xffefc4,emissive:0x4c3914});
const redMat=new THREE.MeshStandardMaterial({color:0xb51f27,emissive:0x250000});
const parts={};let selected=null;let selectionHelper=null;
function makePart(id,name,description){const g=new THREE.Group();g.userData.partId=id;car.add(g);parts[id]={group:g,name,description,removed:false};return g}
function pbox(parent,w,h,d,x,y,z,mat){const m=box(parent,w,h,d,x,y,z,mat);return m}
function cylinder(parent,radius,length,x,y,z,mat,axis='x'){const m=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,length,28),mat);if(axis==='x')m.rotation.z=Math.PI/2;else if(axis==='z')m.rotation.x=Math.PI/2;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
// Structure permanente
pbox(car,1.95,.42,3.85,0,.65,0,black);
pbox(car,1.9,.38,3.55,0,.82,0,paint);
pbox(car,1.94,.22,1.05,0,.91,-1.22,paint);
pbox(car,1.94,.22,1.05,0,.91,1.28,paint);
// Habitacle
const cabin=new THREE.Group();car.add(cabin);
pbox(cabin,1.52,.72,1.9,0,1.48,-.15,paint);
pbox(cabin,1.42,.5,1.72,0,1.51,-.15,glass);
pbox(cabin,1.56,.09,1.94,0,1.88,-.15,paint);
for(const x of [-.79,.79]){pbox(cabin,.07,.72,.08,x,1.48,-.15,black);pbox(cabin,.07,.08,1.8,x,1.83,-.15,black)}
// Intérieur visible
pbox(car,1.35,.12,1.5,0,1.12,-.12,black);
for(const x of [-.48,.48]){pbox(car,.42,.48,.38,x,1.36,-.5,black);pbox(car,.42,.48,.38,x,1.36,.32,black)}
// Capot amovible
const hood=makePart('hood','Capot moteur','Protège le compartiment moteur. Retire-le pour accéder au moteur et à la batterie.');
pbox(hood,1.83,.13,1.12,0,1.04,1.28,paint);
pbox(hood,1.68,.035,.92,0,1.115,1.28,new THREE.MeshStandardMaterial({color:0xd94a4e,roughness:.4}));
// Moteur et batterie accessibles après retrait du capot
const engine=makePart('engine','Moteur','Bloc moteur principal. Il est installé dans le compartiment avant.');
pbox(engine,.9,.62,.85,0,1.02,1.05,new THREE.MeshStandardMaterial({color:0x68747a,metalness:.65,roughness:.45}));
pbox(engine,.62,.16,.55,0,1.42,1.05,black);
for(let i=0;i<4;i++)pbox(engine,.12,.25,.16,-.28+i*.19,1.58,1.05,metal);
const battery=makePart('battery','Batterie','Alimente le système électrique du véhicule. Deux bornes sont visibles sur le dessus.');
pbox(battery,.48,.42,.42,-.62,1.12,1.42,new THREE.MeshStandardMaterial({color:0x263d4a}));
pbox(battery,.12,.06,.12,-.72,1.36,1.42,metal);pbox(battery,.12,.06,.12,-.52,1.36,1.42,redMat);
// Roues indépendantes
const wheelIds=[];
for(const [id,x,z,label] of [['wheel-fl',-1.03,1.22,'avant gauche'],['wheel-fr',1.03,1.22,'avant droite'],['wheel-rl',-1.03,-1.28,'arrière gauche'],['wheel-rr',1.03,-1.28,'arrière droite']]){
 wheelIds.push(id);const g=makePart(id,'Roue '+label,'Ensemble roue et pneu. Cette pièce peut être déposée pour accéder au moyeu.');
 cylinder(g,.43,.27,x,.48,z,rubber);cylinder(g,.27,.29,x*1.01,.48,z,metal);cylinder(g,.11,.31,x*1.02,.48,z,black);
 for(let k=0;k<8;k++){const a=k*Math.PI/4;const spoke=pbox(g,.055,.25,.045,x+Math.sign(x)*.15,.48+Math.sin(a)*.12,z+Math.cos(a)*.12,metal);spoke.rotation.x=a}
}
// Portes amovibles
for(const [id,x,side] of [['door-left',-1.0,'gauche'],['door-right',1.0,'droite']]){const g=makePart(id,'Porte '+side,'Panneau de porte et vitre latérale. Tu peux le déposer puis le remettre.');pbox(g,.09,.72,1.05,x,1.13,-.05,paint);pbox(g,.07,.37,.83,x,1.65,-.05,glass);pbox(g,.1,.06,.18,x*1.02,1.32,.3,metal)}
// Petits détails de carrosserie pour rendre la 205 plus lisible.
pbox(car,1.12,.2,.055,0,.72,2.105,black);
for(let i=0;i<5;i++)pbox(car,.035,.14,.025,-.42+i*.21,.72,2.14,metal);
cylinder(car,.075,.035,0,.76,2.16,metal,'z');
for(const x of [-.98,.98]){pbox(car,.13,.12,.22,x,1.26,.72,black);pbox(car,.17,.1,.16,x*1.08,1.31,.72,glass)}
for(const x of [-.53,.53])pbox(car,.12,.045,.035,x,1.24,-.62,metal);
cylinder(car,.065,.34,-.42,.3,-2.12,metal,'x');
// Pare-chocs et éclairage
pbox(car,1.95,.2,.18,0,.48,2.03,black);pbox(car,1.95,.2,.18,0,.48,-2.03,black);
for(const x of [-.68,.68]){pbox(car,.42,.22,.07,x,.88,1.99,lightMat);pbox(car,.4,.2,.07,x,.86,-1.99,redMat)}
// Sélection visuelle : contour lumineux sur les pièces.

function setPartVisible(id,visible){parts[id].group.visible=visible;parts[id].removed=!visible}
function choose(id){
 selected=id;const part=parts[id];
 document.querySelector('#part-name').textContent=part.name;
 document.querySelector('#part-info').textContent=part.description;
 document.querySelector('#remove').disabled=part.removed;
 document.querySelector('#install').disabled=!part.removed;
 if(selectionHelper){scene.remove(selectionHelper);selectionHelper.geometry.dispose();selectionHelper.material.dispose();selectionHelper=null}
 if(!part.removed){selectionHelper=new THREE.BoxHelper(part.group,0x65f0ad);selectionHelper.material.depthTest=false;selectionHelper.material.transparent=true;selectionHelper.material.opacity=.95;scene.add(selectionHelper)}
}
function refresh(){const done=Object.values(parts).filter(p=>p.removed).length,total=Object.keys(parts).length;document.querySelector('#count').textContent=done+' / '+total;document.querySelector('#bar').style.width=(done/total*100)+'%'}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.style.opacity='1';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.opacity='0',1600)}
document.querySelector('#remove').addEventListener('click',()=>{if(!selected)return;const part=parts[selected];if(part.removed)return;setPartVisible(selected,false);choose(selected);refresh();toast(part.name+' démonté(e)')});
document.querySelector('#install').addEventListener('click',()=>{if(!selected)return;const part=parts[selected];if(!part.removed)return;setPartVisible(selected,true);choose(selected);refresh();toast(part.name+' remonté(e)')});
// Contrôle caméra : glisser pour tourner, molette/pincement pour zoomer.
let azimuth=.72,polar=1.13,distance=8.8,drag=null,pinchStart=0,moved=false;
const target=new THREE.Vector3(0,.85,0);
function updateCamera(){polar=THREE.MathUtils.clamp(polar,.35,1.48);distance=THREE.MathUtils.clamp(distance,4.8,15);camera.position.set(target.x+distance*Math.sin(polar)*Math.sin(azimuth),target.y+distance*Math.cos(polar),target.z+distance*Math.sin(polar)*Math.cos(azimuth));camera.lookAt(target)}
updateCamera();
const pointers=new Map();
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(pointers.size===1)drag={x:e.clientX,y:e.clientY,az:azimuth,pol:polar};if(pointers.size===2){const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;azimuth=drag.az-dx*.008;polar=drag.pol+dy*.006;updateCamera()}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStart>0){distance*=pinchStart/d;pinchStart=d;updateCamera()}}});
function pointerUp(e){pointers.delete(e.pointerId);if(pointers.size===0){drag=null;pinchStart=0}}
renderer.domElement.addEventListener('pointerup',pointerUp);renderer.domElement.addEventListener('pointercancel',pointerUp);
renderer.domElement.addEventListener('wheel',e=>{distance+=e.deltaY*.008;updateCamera()},{passive:true});
// Cliquer sur une pièce seulement si le pointeur n'a pas servi à déplacer la caméra.
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt={x:e.clientX,y:e.clientY,id:e.pointerId}});
renderer.domElement.addEventListener('pointerup',e=>{if(!downAt||downAt.id!==e.pointerId)return;const movedPx=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y);downAt=null;if(movedPx>7||pointers.size>0)return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObject(car,true);for(const hit of hits){let o=hit.object;while(o&&o!==car&&!o.userData.partId)o=o.parent;if(o&&o.userData.partId){choose(o.userData.partId);return}}});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
function animate(){requestAnimationFrame(animate);if(selectionHelper)selectionHelper.update();renderer.render(scene,camera)}animate();
</script>
</body></html>
