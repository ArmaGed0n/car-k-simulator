<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K Simulateur 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,Arial;background:#91b9cf;color:white}canvas{display:block}
.hud{position:fixed;background:#101923d9;border:1px solid #ffffff30;border-radius:13px;padding:12px 16px;backdrop-filter:blur(8px);z-index:2}
#logo{top:14px;left:14px;font-weight:900;letter-spacing:2px}#logo b{color:#62dda1}
#speed{top:14px;right:14px;text-align:right;font-size:28px;font-weight:900}#speed small{font-size:11px}
#keys{display:none}
#touch{position:fixed;inset:0;z-index:3;pointer-events:none;display:none;touch-action:none}
.pad{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:end;pointer-events:auto}
#steering{left:16px}#pedals{right:16px;flex-direction:column;align-items:stretch}
.ctrl{width:68px;height:68px;border-radius:22px;background:#101923b8;border:2px solid #ffffff70;color:white;font-size:26px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}
#pedals .ctrl{width:76px;height:76px;font-size:15px}#gas{background:#168b61dc}#brake{background:#b13b42dc}
.ctrl:active,.ctrl.down{filter:brightness(1.4);transform:scale(.96)}
#intro section{width:min(440px,calc(100vw - 32px))}
@media(pointer:coarse),(max-width:800px){#touch{display:block}#keys{display:none}#speed{font-size:23px;padding:9px 12px}#logo{font-size:13px;padding:9px 11px}}
@media(orientation:portrait) and (pointer:coarse){#touch:after{content:"";position:absolute;top:68px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffffffa8;white-space:nowrap}}

#intro{position:fixed;inset:0;background:#07131dcc;display:grid;place-items:center;z-index:5}
#intro section{background:#142330;border:1px solid #ffffff30;border-radius:20px;padding:30px;text-align:center;max-width:420px;margin:18px}
h1{margin:0 0 10px;font-size:34px}h1 span{color:#62dda1}p{color:#c4d2dc}
button{border:0;border-radius:12px;padding:13px 24px;background:#62dda1;color:#092017;font-weight:900;font-size:15px;cursor:pointer}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="logo" class="hud">K <b>SIMULATEUR</b> · 3D</div><div id="speed" class="hud">0 <small>KM/H</small></div>
<div id="keys" class="hud">Z / W : accélérer · S : freiner<br>Q / A : gauche · D : droite<br>Espace : frein à main · R : recommencer</div>
<div id="touch">
 <div class="pad" id="steering"><button class="ctrl" data-control="left" aria-label="Tourner à gauche">◀</button><button class="ctrl" data-control="right" aria-label="Tourner à droite">▶</button></div>
 <div class="pad" id="pedals"><button class="ctrl" id="gas" data-control="gas">ACCÉL.</button><button class="ctrl" id="brake" data-control="brake">FREIN</button></div>
</div>
<div id="intro"><section><h1>K <span>SIMULATEUR</span></h1><p>Bienvenue en ville ! Prends le volant et explore ton premier monde 3D.</p><button id="play">DÉMARRER</button></section></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9df);scene.fog=new THREE.Fog(0x9bc9df,100,270);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const isMobile=matchMedia('(pointer:coarse)').matches;const renderer=new THREE.WebGLRenderer({antialias:!isMobile,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.5:2));renderer.shadowMap.enabled=!isMobile;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f7ff,0x536b4b,2));const sun=new THREE.DirectionalLight(0xfff0d2,2.2);sun.position.set(-40,80,35);sun.castShadow=true;scene.add(sun);
const material=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.82});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),material(0x64875c));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadmat=material(0x343a40),side=material(0xbcbdb5),windowmat=material(0x86bdcc);
function block(w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
for(let i=-3;i<=3;i++){block(12,.12,310,i*42,.06,0,roadmat);block(310,.12,12,0,.06,i*42,roadmat)}
for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++){
 const cx=x*42,cz=z*42;block(27,.3,27,cx+21,.16,cz+21,side);
 for(let n=0;n<4;n++){const bx=cx+9+(n%2)*14,bz=cz+9+Math.floor(n/2)*14,h=8+((x*13+z*7+n*11+100)%17);
 block(8,h,8,bx,h/2+.35,bz,material([0xb9aa96,0x8ba8b3,0xc9bda7,0x87949b][(n+x-z+20)%4]));block(8.2,.3,8.2,bx,h+.5,bz,material(0x56616a));
 for(let yy=2;yy<h-1;yy+=3)for(let xx of [-2,2])block(.08,1,.9,bx+xx,yy,bz-4.05,windowmat);
 }
}
for(let i=0;i<70;i++){const x=Math.sin(i*91.7)*135,z=Math.cos(i*37.2)*135;if(Math.abs(x%42)<9||Math.abs(z%42)<9)continue;block(.45,2,.45,x,1,z,material(0x65472e));const crown=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,7),material(0x39794b));crown.position.set(x,3,z);scene.add(crown)}
const car=new THREE.Group();scene.add(car);
// Build car parts as children
const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,.7,4.1),material(0xd63237));body.position.y=.85;body.castShadow=true;car.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.6,.8,2),material(0x8dbacb));cabin.position.set(0,1.55,-.25);car.add(cabin);
const wheelmat=material(0x17191c);
for(const x of [-1.08,1.08])for(const z of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,16),wheelmat);w.rotation.z=Math.PI/2;w.position.set(x,.48,z);car.add(w)}
car.position.set(0,0,0);
const pressed={};
addEventListener('keydown',e=>{pressed[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();if(e.key.toLowerCase()==='r')resetCar()});
addEventListener('keyup',e=>pressed[e.key.toLowerCase()]=false);
function resetCar(){car.position.set(0,0,0);car.rotation.y=0;heading=0;speed=0}
const touchMap={left:'left',right:'right',gas:'gas',brake:'brake'};
document.querySelectorAll('[data-control]').forEach(btn=>{
 const key=touchMap[btn.dataset.control];
 const down=e=>{e.preventDefault();pressed[key]=true;btn.classList.add('down');if(btn.setPointerCapture&&e.pointerId!==undefined)btn.setPointerCapture(e.pointerId)};
 const up=e=>{e.preventDefault();pressed[key]=false;btn.classList.remove('down')};
 btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up);
});
document.addEventListener('contextmenu',e=>e.preventDefault());
let speed=0,heading=0,active=false;document.querySelector('#play').onclick=()=>{active=true;document.querySelector('#intro').style.display='none'};
const clock=new THREE.Clock(),look=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
if(active){const go=pressed.z||pressed.w||pressed.arrowup||pressed.gas,stop=pressed.s||pressed.arrowdown||pressed.brake,L=pressed.q||pressed.a||pressed.arrowleft||pressed.left,R=pressed.d||pressed.arrowright||pressed.right,hand=pressed[' '];
if(go)speed+=22*dt;else if(stop)speed-=32*dt;else speed*=Math.pow(.986,dt*60);speed=THREE.MathUtils.clamp(speed,-11,hand?20:42);if(hand)speed*=Math.pow(.94,dt*60);
heading+=((L?1:0)-(R?1:0))*dt*(.8+Math.min(Math.abs(speed)/20,1.3))*Math.sign(speed||1);car.rotation.y=heading;car.position.x+=Math.sin(heading)*speed*dt;car.position.z+=Math.cos(heading)*speed*dt;
document.querySelector('#speed').innerHTML=Math.round(Math.abs(speed)*3.6)+' <small>KM/H</small>'}
look.set(car.position.x,1.2,car.position.z);const offset=new THREE.Vector3(-Math.sin(heading)*10,6,-Math.cos(heading)*10);camera.position.lerp(look.clone().add(offset),.09);camera.lookAt(look);renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.5:2))});
</script></body></html>
